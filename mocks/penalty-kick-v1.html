<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ペナルティーキック · モック v1 · Direction C</title>
  <style>
    :root {
      --sky: #D6DAD2;
      --pitch: #427848;
      --pitch-line: #EDE8DC;
      --post: #1E2620;
      --goal-cell: #F3F0E6;
      --goal-rule: #243028;
      --hud-bar: #1E2620;
      --ink: #F4F1E8;
      --secondary: #C5CCC0;
      --cell: #2C3830;
      --cell-line: #C8D0C4;
      --selected: #E2B93A;
      --selected-ink: #1A2218;
      --action: #F4F1E8;
      --action-ink: #1A2218;
      --disabled-bg: #303A32;
      --disabled-ink: #A8B0A4;
      --result-goal: #F3E6A8;
      --result-save: #D4E2EC;
      --result-miss: #E8D4C4;
      --silhouette: #141A16;
      --page: #EEECE4;
      --page-ink: #1C2420;
      --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "YuGothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--page);
      color: var(--page-ink);
      font-family: var(--font);
      padding: 28px 20px 72px;
    }

    .intro {
      max-width: 1280px;
      margin: 0 auto 28px;
    }
    .intro h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
    }
    .intro p {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #4A524C;
      max-width: 42rem;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: flex-start;
    }
    .shot { width: 390px; }
    .shot figcaption {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .shot figcaption span {
      display: block;
      font-weight: 400;
      color: #4A524C;
      margin-top: 2px;
    }

    .phone {
      width: 390px;
      height: 800px;
      border-radius: 36px;
      overflow: hidden;
      background: var(--pitch);
      border: 3px solid #1E2620;
      box-shadow: 0 10px 28px rgba(30, 38, 32, 0.14);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .hud {
      flex: 0 0 auto;
      background: var(--hud-bar);
      color: var(--ink);
      padding: 18px 18px 12px;
      z-index: 3;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 32px;
    }
    .mark {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .diff {
      appearance: none;
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 8px;
      cursor: default;
    }
    .hud-score {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 8px;
      gap: 16px;
    }
    .nums {
      display: block;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .cap {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--secondary);
    }
    .streak { text-align: right; }

    .pitch {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
      background: linear-gradient(180deg, var(--sky) 0 146px, var(--pitch) 146px);
      overflow: hidden;
    }

    .box6 {
      position: absolute;
      top: 146px;
      left: 50%;
      width: 168px;
      height: 54px;
      transform: translateX(-50%);
      border: 2px solid rgba(237, 232, 220, 0.78);
      border-top: 0;
      pointer-events: none;
      z-index: 1;
    }

    .goal-wrap {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 118px;
      z-index: 2;
    }
    .goal-line {
      position: absolute;
      left: -16px;
      right: -16px;
      bottom: 0;
      height: 3px;
      background: var(--pitch-line);
      z-index: 3;
    }
    .goal {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--goal-cell);
    }
    .goal-grid {
      position: absolute;
      inset: 10px 10px 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 2px;
      background: var(--goal-rule);
    }
    .goal-cell {
      background: var(--goal-cell);
      border-radius: 0;
    }
    .goal-cell.is-on {
      background: var(--selected);
      box-shadow: inset 0 0 0 3px var(--selected-ink), 0 0 0 2px var(--selected-ink);
      position: relative;
      z-index: 1;
    }
    .post, .bar {
      position: absolute;
      background: var(--post);
    }
    .post { top: 0; bottom: 0; width: 10px; }
    .post.l { left: 0; }
    .post.r { right: 0; }
    .bar { top: 0; left: 0; right: 0; height: 10px; }

    .ball-in-goal {
      display: block;
      width: 16px;
      height: 16px;
      margin: auto;
      border-radius: 50%;
      background: #F7F4EC;
      border: 1.5px solid var(--post);
      position: relative;
      top: 50%;
      transform: translateY(-50%);
    }
    .goal-cell.is-on {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .goal-cell.is-on .ball-in-goal {
      top: 0;
      transform: none;
    }

    .keeper, .kicker {
      position: absolute;
      z-index: 2;
      color: var(--silhouette);
    }
    .keeper {
      width: 40px;
      height: 56px;
      left: 50%;
      top: 90px; /* feet on the goal line (wrap top 28 + 118 = 146) */
      transform: translateX(-50%);
    }
    .keeper.is-dived-left {
      top: 96px;
      left: 96px;
      width: 44px;
      height: 58px;
      transform: rotate(-58deg);
      transform-origin: 50% 80%;
    }
    .kicker {
      width: 54px;
      height: 76px;
      left: 50%;
      bottom: 28px;
      transform: translateX(-70%);
    }
    .spot-ring {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 10px;
      width: 28px;
      height: 28px;
      transform: translateX(-50%);
      border: 1.5px solid rgba(237, 232, 220, 0.85);
      border-radius: 50%;
      pointer-events: none;
    }
    .spot {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 16px;
      width: 16px;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #F7F4EC;
      border: 1.5px solid var(--post);
    }

    .deck {
      flex: 0 0 auto;
      background: var(--hud-bar);
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 3;
    }
    .pick {
      margin: 0 0 10px;
      color: var(--secondary);
      font-size: 13px;
      min-height: 18px;
    }

    .pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .pad button {
      appearance: none;
      min-height: 52px;
      border: 1px solid var(--cell-line);
      background: var(--cell);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: default;
    }
    .pad button[aria-pressed="true"] {
      background: var(--selected);
      color: var(--selected-ink);
      border-color: var(--selected-ink);
      box-shadow: inset 0 0 0 2px var(--selected-ink);
    }

    .powers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .powers button,
    .kick,
    .again,
    .sheet-btn {
      appearance: none;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: default;
      min-height: 48px;
    }
    .powers button {
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
    }
    .powers button[aria-pressed="true"] {
      background: var(--selected);
      color: var(--selected-ink);
      border-color: var(--selected-ink);
      box-shadow: inset 0 0 0 2px var(--selected-ink);
    }
    .hint {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--secondary);
    }
    .kick, .again {
      width: 100%;
      margin-top: 10px;
      min-height: 52px;
      border: 0;
      background: var(--action);
      color: var(--action-ink);
      font-size: 17px;
    }
    .kick[disabled] {
      background: var(--disabled-bg);
      color: var(--disabled-ink);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(30, 38, 32, 0) 0 46%,
        rgba(30, 38, 32, 0.28) 68%,
        rgba(30, 38, 32, 0.5) 100%
      );
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 16px 28px;
    }
    .overlay.is-confirm {
      background: linear-gradient(
        180deg,
        rgba(30, 38, 32, 0.1) 0 34%,
        rgba(30, 38, 32, 0.5) 56%,
        rgba(30, 38, 32, 0.72) 100%
      );
    }
    .stage {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .result-word {
      margin: auto 0 12px;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.1;
      /* diagram outline, not a photo glow */
      text-shadow:
        -2px 0 0 #1A2218,
         2px 0 0 #1A2218,
         0 -2px 0 #1A2218,
         0  2px 0 #1A2218,
        -1px -1px 0 #1A2218,
         1px -1px 0 #1A2218,
        -1px  1px 0 #1A2218,
         1px  1px 0 #1A2218;
    }
    .result-word.is-goal { color: var(--result-goal); }
    .result-hint {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--secondary);
    }
    .overlay .again { margin-top: 0; max-width: 358px; }

    .sheet {
      width: 100%;
      background: var(--hud-bar);
      color: var(--ink);
      border-radius: 10px;
      padding: 22px 18px 16px;
      border: 1px solid #3A4440;
    }
    .sheet p {
      margin: 0;
      font-size: 17px;
      line-height: 1.55;
      font-weight: 600;
    }
    .sheet .fromto {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 400;
      color: var(--secondary);
    }
    .sheet-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }
    .sheet-btn {
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
    }
    .sheet-btn.go {
      border: 0;
      background: var(--action);
      color: var(--action-ink);
    }

    svg { display: block; width: 100%; height: 100%; }
    svg .fill { fill: currentColor; }
    svg .stroke {
      stroke: currentColor;
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <h1>ペナルティーキック · Direction C · 図解ヨリ</h1>
    <p>静的モック（ゲームロジックなし）。幅 390px。左から狙い、ゴール！、難易度を変える確認。Justin が Direction C を選んだ（2026-11-11）。visual OK はまだ。</p>
  </header>

  <main class="gallery">

    <figure class="shot">
      <figcaption>狙い<span>右上とコースを選び、蹴る手前</span></figcaption>
      <div class="phone" aria-label="狙い">
        <header class="hud">
          <div class="hud-top">
            <span class="mark">PK</span>
            <button type="button" class="diff" tabindex="-1">ふつう</button>
          </div>
          <div class="hud-score">
            <div>
              <span class="nums">3 / 7</span>
              <span class="cap">入った数／蹴った数</span>
            </div>
            <div class="streak">
              <span class="nums">2</span>
              <span class="cap">連続</span>
            </div>
          </div>
        </header>
        <div class="stage">
          <div class="pitch">
            <div class="box6" aria-hidden="true"></div>
            <div class="goal-wrap">
              <div class="goal" aria-hidden="true">
                <div class="goal-grid">
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell is-on"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                </div>
                <span class="post l"></span>
                <span class="post r"></span>
                <span class="bar"></span>
              </div>
              <span class="goal-line" aria-hidden="true"></span>
            </div>
            <div class="keeper" aria-hidden="true">
              <svg viewBox="0 0 48 70">
                <circle class="fill" cx="24" cy="10" r="6.2"/>
                <path class="fill" d="M16 18h16l-1.6 22H17.6z"/>
                <path class="stroke" d="M16 21 L7 34"/>
                <path class="stroke" d="M32 21 L41 34"/>
                <path class="stroke" d="M20 40 L16 66"/>
                <path class="stroke" d="M28 40 L32 66"/>
              </svg>
            </div>
            <div class="kicker" aria-hidden="true">
              <svg viewBox="0 0 40 62">
                <circle class="fill" cx="20" cy="9" r="6"/>
                <path class="fill" d="M11 17h18l-1.4 20H12.4z"/>
                <path class="stroke" d="M12 21 L6 36"/>
                <path class="stroke" d="M28 21 L35 30"/>
                <path class="stroke" d="M16 37 L13 58"/>
                <path class="stroke" d="M24 37 L30 58"/>
              </svg>
            </div>
            <span class="spot-ring" aria-hidden="true"></span>
            <div class="spot" aria-hidden="true"></div>
          </div>
          <div class="deck">
            <p class="pick">右上 · コース</p>
            <div class="pad" role="group" aria-label="狙う場所">
              <button type="button" tabindex="-1">左上</button>
              <button type="button" tabindex="-1">上</button>
              <button type="button" tabindex="-1" aria-pressed="true">右上</button>
              <button type="button" tabindex="-1">左</button>
              <button type="button" tabindex="-1">まんなか</button>
              <button type="button" tabindex="-1">右</button>
              <button type="button" tabindex="-1">左下</button>
              <button type="button" tabindex="-1">下</button>
              <button type="button" tabindex="-1">右下</button>
            </div>
            <div class="powers" role="group" aria-label="蹴り方">
              <button type="button" tabindex="-1" aria-pressed="true">コース</button>
              <button type="button" tabindex="-1">パワー</button>
            </div>
            <p class="hint">枠に入りやすい</p>
            <button type="button" class="kick" tabindex="-1">蹴る</button>
          </div>
        </div>
      </div>
    </figure>

    <figure class="shot">
      <figcaption>ゴール！<span>結果の語が一番大きい。もう一回は親指帯</span></figcaption>
      <div class="phone" aria-label="ゴール">
        <header class="hud">
          <div class="hud-top">
            <span class="mark">PK</span>
            <button type="button" class="diff" tabindex="-1">ふつう</button>
          </div>
          <div class="hud-score">
            <div>
              <span class="nums">4 / 8</span>
              <span class="cap">入った数／蹴った数</span>
            </div>
            <div class="streak">
              <span class="nums">3</span>
              <span class="cap">連続</span>
            </div>
          </div>
        </header>
        <div class="stage">
          <div class="pitch">
            <div class="box6" aria-hidden="true"></div>
            <div class="goal-wrap">
              <div class="goal" aria-hidden="true">
                <div class="goal-grid">
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell is-on"><span class="ball-in-goal"></span></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                </div>
                <span class="post l"></span>
                <span class="post r"></span>
                <span class="bar"></span>
              </div>
              <span class="goal-line" aria-hidden="true"></span>
            </div>
            <div class="keeper is-dived-left" aria-hidden="true">
              <svg viewBox="0 0 48 70">
                <circle class="fill" cx="24" cy="10" r="6.2"/>
                <path class="fill" d="M16 18h16l-1.6 22H17.6z"/>
                <path class="stroke" d="M16 21 L4 28"/>
                <path class="stroke" d="M32 21 L46 24"/>
                <path class="stroke" d="M20 40 L10 62"/>
                <path class="stroke" d="M28 40 L38 58"/>
              </svg>
            </div>
          </div>
          <div class="overlay" role="status">
            <p class="result-word is-goal">ゴール！</p>
            <button type="button" class="again" tabindex="-1">もう一回</button>
          </div>
        </div>
      </div>
    </figure>

    <figure class="shot">
      <figcaption>難易度を変える<span>誤って得点を消さないための確認</span></figcaption>
      <div class="phone" aria-label="難易度の確認">
        <header class="hud">
          <div class="hud-top">
            <span class="mark">PK</span>
            <button type="button" class="diff" tabindex="-1">ふつう</button>
          </div>
          <div class="hud-score">
            <div>
              <span class="nums">3 / 7</span>
              <span class="cap">入った数／蹴った数</span>
            </div>
            <div class="streak">
              <span class="nums">2</span>
              <span class="cap">連続</span>
            </div>
          </div>
        </header>
        <div class="stage">
          <div class="pitch">
            <div class="box6" aria-hidden="true"></div>
            <div class="goal-wrap">
              <div class="goal" aria-hidden="true">
                <div class="goal-grid">
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                  <div class="goal-cell"></div>
                </div>
                <span class="post l"></span>
                <span class="post r"></span>
                <span class="bar"></span>
              </div>
              <span class="goal-line" aria-hidden="true"></span>
            </div>
            <div class="keeper" aria-hidden="true">
              <svg viewBox="0 0 48 70">
                <circle class="fill" cx="24" cy="10" r="6.2"/>
                <path class="fill" d="M16 18h16l-1.6 22H17.6z"/>
                <path class="stroke" d="M16 21 L7 34"/>
                <path class="stroke" d="M32 21 L41 34"/>
                <path class="stroke" d="M20 40 L16 66"/>
                <path class="stroke" d="M28 40 L32 66"/>
              </svg>
            </div>
          </div>
          <div class="overlay is-confirm">
            <div class="sheet">
              <p>難易度を変えると、<br>得点はリセットされます</p>
              <p class="fromto">ふつう　→　むずかしい</p>
              <div class="sheet-row">
                <button type="button" class="sheet-btn" tabindex="-1">やめる</button>
                <button type="button" class="sheet-btn go" tabindex="-1">変える</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </figure>

  </main>
</body>
</html>
