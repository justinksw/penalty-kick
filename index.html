<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ペナルティーキック</title>
  <style>
    :root {
      --sky: #D6DAD2;
      --pitch: #427848;
      --pitch-line: #EDE8DC;
      --post: #1E2620;
      --goal-cell: #F3F0E6;
      --goal-rule: #243028;
      --hud-bar: #1E2620;
      --ink: #F4F1E8;
      --secondary: #C5CCC0;
      --cell: #2C3830;
      --cell-line: #C8D0C4;
      --selected: #E2B93A;
      --selected-ink: #1A2218;
      --action: #F4F1E8;
      --action-ink: #1A2218;
      --disabled-bg: #303A32;
      --disabled-ink: #A8B0A4;
      --result-goal: #F3E6A8;
      --result-save: #D4E2EC;
      --result-miss: #E8D4C4;
      --silhouette: #141A16;
      --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "YuGothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--pitch);
      font-family: var(--font);
      color: var(--ink);
    }

    .shell {
      min-height: 100dvh;
      min-height: 100vh;
      background: var(--pitch);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .preview-badge {
      flex: 0 0 auto;
      background: var(--hud-bar);
      color: var(--ink);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid #3A4440;
    }

    .hud {
      flex: 0 0 auto;
      background: var(--hud-bar);
      padding: 14px 16px 12px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
    }
    .mark {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .diff {
      appearance: none;
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .diff:disabled { opacity: 0.55; cursor: default; }
    .hud-score {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 6px;
      gap: 16px;
    }
    .nums {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .cap {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--secondary);
    }
    .streak { text-align: right; }

    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .pitch {
      position: relative;
      flex: 1 1 auto;
      min-height: 200px;
      background: linear-gradient(180deg, var(--sky) 0 clamp(100px, 26vw, 146px), var(--pitch) clamp(100px, 26vw, 146px));
      overflow: hidden;
    }

    .box6 {
      position: absolute;
      top: clamp(100px, 26vw, 146px);
      left: 50%;
      width: min(168px, 46vw);
      height: 54px;
      transform: translateX(-50%);
      border: 2px solid rgba(237, 232, 220, 0.78);
      border-top: 0;
      pointer-events: none;
      z-index: 1;
    }

    .goal-wrap {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(300px, 86vw);
      height: auto;
      aspect-ratio: 300 / 118;
      z-index: 2;
    }
    .goal-line {
      position: absolute;
      left: -16px;
      right: -16px;
      bottom: 0;
      height: 3px;
      background: var(--pitch-line);
      z-index: 3;
    }
    .goal {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--goal-cell);
    }
    .goal-grid {
      position: absolute;
      inset: 10px 10px 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 2px;
      background: var(--goal-rule);
    }
    .goal-cell {
      background: var(--goal-cell);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .goal-cell.is-on {
      background: var(--selected);
      box-shadow: inset 0 0 0 3px var(--selected-ink), 0 0 0 2px var(--selected-ink);
      z-index: 1;
    }
    .post, .bar {
      position: absolute;
      background: var(--post);
    }
    .post { top: 0; bottom: 0; width: 10px; }
    .post.l { left: 0; }
    .post.r { right: 0; }
    .bar { top: 0; left: 0; right: 0; height: 10px; }

    .ball-in-goal {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #F7F4EC;
      border: 1.5px solid var(--post);
    }

    .keeper, .kicker {
      position: absolute;
      z-index: 2;
      color: var(--silhouette);
      transition: left 0.5s ease, top 0.5s ease, transform 0.5s ease;
    }
    .keeper {
      width: 40px;
      height: 56px;
      left: 50%;
      top: 90px;
      transform: translateX(-50%);
    }
    .keeper.is-dived-left {
      left: 96px;
      top: 96px;
      width: 44px;
      height: 58px;
      transform: rotate(-58deg);
      transform-origin: 50% 80%;
    }
    .keeper.is-dived-right {
      left: calc(100% - 140px);
      top: 96px;
      width: 44px;
      height: 58px;
      transform: rotate(58deg);
      transform-origin: 50% 80%;
    }
    .kicker {
      width: clamp(40px, 12vw, 54px);
      height: clamp(56px, 18vw, 76px);
      left: 50%;
      bottom: clamp(16px, 5vw, 28px);
      transform: translateX(-70%);
    }
    .kicker.is-hidden { visibility: hidden; }
    .kicker.is-kicking { transform: translateX(-70%) scale(1.02); }

    .spot-ring {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 8px;
      width: 28px;
      height: 28px;
      transform: translateX(-50%);
      border: 1.5px solid rgba(237, 232, 220, 0.85);
      border-radius: 50%;
      pointer-events: none;
    }
    .spot {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 14px;
      width: 16px;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #F7F4EC;
      border: 1.5px solid var(--post);
    }
    .spot.is-hidden { visibility: hidden; }

    .deck {
      flex: 0 0 auto;
      background: var(--hud-bar);
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 4;
    }
    .pick {
      margin: 0 0 10px;
      color: var(--secondary);
      font-size: 13px;
      min-height: 18px;
    }

    .pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .pad button {
      appearance: none;
      min-height: 48px;
      border: 1px solid var(--cell-line);
      background: var(--cell);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      padding: 4px 2px;
    }
    .pad button:disabled { cursor: default; opacity: 0.65; }
    .pad button[aria-pressed="true"] {
      background: var(--selected);
      color: var(--selected-ink);
      border-color: var(--selected-ink);
      box-shadow: inset 0 0 0 2px var(--selected-ink);
    }

    .powers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .powers button,
    .kick,
    .again,
    .sheet-btn,
  .diff-opt {
      appearance: none;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
    }
    .powers button {
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
    }
    .powers button:disabled { opacity: 0.65; cursor: default; }
    .powers button[aria-pressed="true"] {
      background: var(--selected);
      color: var(--selected-ink);
      border-color: var(--selected-ink);
      box-shadow: inset 0 0 0 2px var(--selected-ink);
    }
    .hint {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--secondary);
    }
    .kick, .again {
      width: 100%;
      margin-top: 10px;
      min-height: 48px;
      border: 0;
      background: var(--action);
      color: var(--action-ink);
      font-size: 17px;
    }
    .kick[disabled] {
      background: var(--disabled-bg);
      color: var(--disabled-ink);
      cursor: default;
    }
    .again { margin-top: 0; }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(30, 38, 32, 0) 0 46%,
        rgba(30, 38, 32, 0.28) 68%,
        rgba(30, 38, 32, 0.5) 100%
      );
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
    }
    .overlay[hidden] { display: none !important; }
    .overlay .again { pointer-events: auto; }

    .result-word {
      margin: auto 0 12px;
      font-size: clamp(44px, 12vw, 52px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.1;
      text-shadow:
        -2px 0 0 #1A2218,
         2px 0 0 #1A2218,
         0 -2px 0 #1A2218,
         0  2px 0 #1A2218,
        -1px -1px 0 #1A2218,
         1px -1px 0 #1A2218,
        -1px  1px 0 #1A2218,
         1px  1px 0 #1A2218;
      pointer-events: none;
    }
    .result-word.is-goal { color: var(--result-goal); }
    .result-word.is-save { color: var(--result-save); }
    .result-word.is-miss { color: var(--result-miss); }
    .result-hint {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--secondary);
      pointer-events: none;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 8;
      background: linear-gradient(
        180deg,
        rgba(30, 38, 32, 0.1) 0 30%,
        rgba(30, 38, 32, 0.55) 50%,
        rgba(30, 38, 32, 0.85) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }
    .sheet-backdrop[hidden] { display: none !important; }

    .sheet {
      width: 100%;
      background: var(--hud-bar);
      color: var(--ink);
      border-radius: 10px 10px 0 0;
      padding: 20px 18px 18px;
      border-top: 1px solid #3A4440;
    }
    .sheet h2 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--secondary);
    }
    .sheet p {
      margin: 0;
      font-size: 17px;
      line-height: 1.55;
      font-weight: 600;
    }
    .sheet .fromto {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 400;
      color: var(--secondary);
    }
    .sheet-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }
    .sheet-btn {
      border: 1px solid var(--cell-line);
      background: transparent;
      color: var(--ink);
    }
    .sheet-btn.go {
      border: 0;
      background: var(--action);
      color: var(--action-ink);
    }
    .diff-list {
      display: grid;
      gap: 8px;
    }
    .diff-opt {
      width: 100%;
      border: 1px solid var(--cell-line);
      background: var(--cell);
      color: var(--ink);
      min-height: 48px;
    }

    svg { display: block; width: 100%; height: 100%; }
    svg .fill { fill: currentColor; }
    svg .stroke {
      stroke: currentColor;
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .keeper, .kicker { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <p class="preview-badge" role="status">PREVIEW</p>

      <header class="hud">
        <div class="hud-top">
          <span class="mark">PK</span>
          <button type="button" class="diff" id="diff-btn">ふつう</button>
        </div>
        <div class="hud-score">
          <div>
            <span class="nums" id="score-nums">0 / 0</span>
            <span class="cap">入った数／蹴った数</span>
          </div>
          <div class="streak">
            <span class="nums" id="streak-nums">0</span>
            <span class="cap">連続</span>
          </div>
        </div>
      </header>

      <div class="stage">
        <div class="pitch">
          <div class="box6" aria-hidden="true"></div>
          <div class="goal-wrap">
            <div class="goal" aria-hidden="true">
              <div class="goal-grid" id="goal-grid">
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
                <div class="goal-cell"></div>
              </div>
              <span class="post l"></span>
              <span class="post r"></span>
              <span class="bar"></span>
            </div>
            <span class="goal-line" aria-hidden="true"></span>
          </div>

          <div class="keeper is-center" id="keeper" aria-hidden="true">
            <svg viewBox="0 0 48 70" class="keeper-svg">
              <circle class="fill" cx="24" cy="10" r="6.2"/>
              <path class="fill" d="M16 18h16l-1.6 22H17.6z"/>
              <path class="stroke arm-l" d="M16 21 L7 34"/>
              <path class="stroke arm-r" d="M32 21 L41 34"/>
              <path class="stroke leg-l" d="M20 40 L16 66"/>
              <path class="stroke leg-r" d="M28 40 L32 66"/>
            </svg>
          </div>

          <div class="kicker" id="kicker" aria-hidden="true">
            <svg viewBox="0 0 40 62">
              <circle class="fill" cx="20" cy="9" r="6"/>
              <path class="fill" d="M11 17h18l-1.4 20H12.4z"/>
              <path class="stroke" d="M12 21 L6 36"/>
              <path class="stroke" d="M28 21 L35 30"/>
              <path class="stroke" d="M16 37 L13 58"/>
              <path class="stroke" d="M24 37 L30 58"/>
            </svg>
          </div>
          <span class="spot-ring" aria-hidden="true"></span>
          <div class="spot" id="ball-spot" aria-hidden="true"></div>
        </div>

        <div class="deck" id="deck">
          <p class="pick" id="pick-line"></p>
          <div class="pad" id="zone-pad" role="group" aria-label="狙う場所">
            <button type="button" data-index="0">左上</button>
            <button type="button" data-index="1">上</button>
            <button type="button" data-index="2">右上</button>
            <button type="button" data-index="3">左</button>
            <button type="button" data-index="4">まんなか</button>
            <button type="button" data-index="5">右</button>
            <button type="button" data-index="6">左下</button>
            <button type="button" data-index="7">下</button>
            <button type="button" data-index="8">右下</button>
          </div>
          <div class="powers" id="power-group" role="group" aria-label="蹴り方">
            <button type="button" data-power="placed" aria-pressed="true">コース</button>
            <button type="button" data-power="driven">パワー</button>
          </div>
          <p class="hint" id="power-hint">枠に入りやすい</p>
          <button type="button" class="kick" id="kick-btn" disabled>蹴る</button>
        </div>

        <div class="overlay" id="result-overlay" hidden role="status">
          <p class="result-word is-goal" id="result-word">ゴール！</p>
          <p class="result-hint" id="result-hint" hidden></p>
          <button type="button" class="again" id="again-btn" hidden>もう一回</button>
        </div>

        <div class="sheet-backdrop" id="diff-picker" hidden>
          <div class="sheet">
            <h2>難易度</h2>
            <div class="diff-list">
              <button type="button" class="diff-opt" data-diff="easy">やさしい</button>
              <button type="button" class="diff-opt" data-diff="normal">ふつう</button>
              <button type="button" class="diff-opt" data-diff="hard">むずかしい</button>
            </div>
            <div class="sheet-row">
              <button type="button" class="sheet-btn" id="diff-cancel">閉じる</button>
            </div>
          </div>
        </div>

        <div class="sheet-backdrop" id="diff-confirm" hidden>
          <div class="sheet">
            <p>難易度を変えると、<br>得点はリセットされます</p>
            <p class="fromto" id="confirm-fromto">ふつう　→　むずかしい</p>
            <div class="sheet-row">
              <button type="button" class="sheet-btn" id="diff-abort">やめる</button>
              <button type="button" class="sheet-btn go" id="diff-apply">変える</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
